name: Train Model

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: "環境確認だけ行う（学習しない）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  train:
    name: Train Core ML classifier
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install dependencies
        run: pip install -r ml/requirements.txt
      - name: Train
        run: |
          if [[ "${{ inputs.check_only }}" == "true" ]]; then
            python ml/train.py --check
          else
            python ml/train.py --output build/ml
          fi
      - name: Upload model
        if: inputs.check_only != true
        uses: actions/upload-artifact@v4
        with:
          name: FishClassifier
          path: build/ml
          if-no-files-found: warn
