name: Tide
options:
  bundleIdPrefix: jp.tide
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
packages:
  TideCore:
    path: TideCore
targets:
  Tide:
    type: application
    platform: iOS
    sources:
      - path: Tide
    dependencies:
      - package: TideCore
      - target: TideWidgets
    entitlements:
      path: Tide/Tide.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.tide.app
        com.apple.developer.weatherkit: true
    info:
      path: Tide/Info.plist
      properties:
        CFBundleDisplayName: Tide
        CFBundleName: Tide
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: 近くの釣り場と、その場所の潮・風・波を表示するために現在地を使います。
        CFBundleURLTypes:
          - CFBundleURLName: jp.tide.app
            CFBundleURLSchemes:
              - tide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tide.app
        PRODUCT_NAME: Tide
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        COREML_CODEGEN_LANGUAGE: None
  TideWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TideWidgets
      - path: Tide/Core/DesignTokens.swift
      - path: Tide/Core/TimeFormat.swift
      - path: Tide/Core/Icons
      - path: Tide/Core/Components/RingView.swift
      - path: Tide/Core/Components/MeterView.swift
      - path: Tide/Core/Components/MoonGlyph.swift
      - path: Tide/Data/WidgetBridge.swift
      - path: Tide/Data/AppContainer.swift
      - path: Tide/Data/Models
      - path: Tide/Data/StockIntents.swift
      - path: Tide/Features/Widgets/Views
    dependencies:
      - package: TideCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: TideWidgets/TideWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.tide.app
    info:
      path: TideWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tide
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tide.app.widgets
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
  TideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TideTests
    dependencies:
      - target: Tide
      - package: TideCore
    info:
      path: TideTests/Info.plist
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tide.app.tests
        GENERATE_INFOPLIST_FILE: "NO"
  TideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TideUITests
    dependencies:
      - target: Tide
    info:
      path: TideUITests/Info.plist
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tide.app.uitests
        GENERATE_INFOPLIST_FILE: "NO"
schemes:
  TideScreenshots:
    build:
      targets:
        Tide: all
        TideUITests: [test]
    test:
      config: Debug
      targets:
        - TideUITests
  Tide:
    build:
      targets:
        Tide: all
        TideWidgets: all
        TideTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TideTests
    archive:
      config: Release
